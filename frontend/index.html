<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- UniHeal Favicon -->
    <link
      rel="icon"
      type="image/webp"
      href="/favicon.webp"
    />

    <!-- Responsive viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO Title -->
    <title>UniHeal - Medical Tourism in India</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="UniHeal helps international patients access trusted healthcare and medical treatment in India, connecting patients with hospitals, doctors, and treatment options."
    />

    <!-- Search Engine Instructions -->
    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://www.unihealhealth.com/"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="UniHeal - Medical Tourism in India"
    />

    <meta
      property="og:description"
      content="UniHeal helps international patients access trusted healthcare and medical treatment in India."
    />

    <meta
      property="og:url"
      content="https://www.unihealhealth.com/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="UniHeal"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
